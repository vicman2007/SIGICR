spring.application.name=demo

# Thymeleaf procesa las vistas ubicadas en src/main/resources/templates.
# En desarrollo se desactiva la caché para ver cambios sin reiniciar.
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

server.port=8080

# Configuración de conexión a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/nombre_de_tu_bd?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root202606

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
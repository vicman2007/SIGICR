<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Administrador</title>
    <style>
      :root {
        --primary: #2563eb;
        --primary-hover: #1d4ed8;
        --danger: #ef4444;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
        --radius: 10px;
        --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        padding: 40px 20px;
      }

      .container {
        max-width: 950px;
        margin: 0 auto;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card-bg);
        padding: 24px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        margin-bottom: 24px;
      }

      h1 {
        font-size: 1.5rem;
        white-space: pre-line;
      }

      .btn-logout {
        background: transparent;
        color: var(--danger);
        border: 1px solid var(--danger);
        padding: 8px 16px;
        border-radius: calc(var(--radius) - 2px);
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn-logout:hover {
        background-color: var(--danger);
        color: white;
      }

      .form-container {
        background: var(--card-bg);
        padding: 24px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        margin-bottom: 24px;
      }

      .form-container h3 {
        margin-bottom: 16px;
        font-size: 1.1rem;
      }

      .grid-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
      }

      input, select {
        width: 100%;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: calc(var(--radius) - 2px);
        font-size: 0.95rem;
        outline: none;
        transition: all 0.2s ease;
      }

      input:focus, select:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
      }

      .btn-save {
        grid-column: 1 / -1;
        background-color: var(--primary);
        color: white;
        border: none;
        padding: 10px 16px;
        border-radius: calc(var(--radius) - 2px);
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .btn-save:hover {
        background-color: var(--primary-hover);
      }

      h2 {
        font-size: 1.25rem;
        margin-bottom: 16px;
      }

      .table-card {
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        overflow: hidden;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background-color: #f1f5f9;
        color: var(--text-muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
      }

      td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        font-size: 0.925rem;
      }

      tbody tr:last-child td {
        border-bottom: none;
      }

      tbody tr:hover {
        background-color: #f8fafc;
      }

      .btn-delete {
        background-color: #fee2e2;
        color: var(--danger);
        border: none;
        padding: 6px 12px;
        border-radius: 6px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .btn-delete:hover {
        background-color: #fca5a5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1 id="bienvenida">Panel Administrador</h1>
        <button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button>
      </div>

      <div class="form-container">
        <h3>Registrar Nuevo Usuario</h3>
        <form id="userForm" class="grid-form">
          <input type="text" id="nombre" placeholder="Nombre completo" required />
          <input
            type="email"
            id="email"
            placeholder="Correo electrónico"
            required
          />
          <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
          />
          <select id="rolId" required>
            <option value="1">ADMIN</option>
            <option value="2" selected>EMPLEADO</option>
          </select>
          <button type="submit" class="btn-save">Guardar Usuario</button>
        </form>
      </div>

      <h2>Lista de Usuarios</h2>
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaUsuarios"></tbody>
        </table>
      </div>
    </div>

    <script>
      const usuarioSesion = JSON.parse(sessionStorage.getItem("usuario"));
      if (!usuarioSesion || usuarioSesion.rol !== "ADMIN") {
        window.location.href = "/login.html";
      } else {
        document.getElementById("bienvenida").textContent = `Bienvenido Admin:\n${usuarioSesion.nombre}`;
        cargarUsuarios();
      }
      async function cargarUsuarios() {
        const res = await fetch("/api/usuarios");
        const usuarios = await res.json();
        const tbody = document.getElementById("tablaUsuarios");
        tbody.innerHTML = "";
        usuarios.forEach((u) => {
          tbody.innerHTML += `
            <tr>
              <td>${u.id}</td>
              <td>${u.nombre}</td>
              <td>${u.email}</td>
              <td>${u.rol ? u.rol.nombre : "Sin Rol"}</td>
              <td><button class="btn-delete" onclick="eliminarUsuario(${u.id})">Eliminar</button></td>
            </tr>`;
        });
      }
      document
        .getElementById("userForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          const nuevoUsuario = {
            nombre: document.getElementById("nombre").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            rol: { id: parseInt(document.getElementById("rolId").value) },
          };
          await fetch("/api/usuarios", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(nuevoUsuario),
          });
          document.getElementById("userForm").reset();
          cargarUsuarios();
        });

      async function eliminarUsuario(id) {
        if (confirm("¿Deseas eliminar este usuario?")) {
          await fetch(`/api/usuarios/${id}`, { method: "DELETE" });
          cargarUsuarios();
        }
      }
      function cerrarSesion() {
        sessionStorage.clear();
        window.location.href = "/login.html";
      }
    </script>
  </body>
</html>
